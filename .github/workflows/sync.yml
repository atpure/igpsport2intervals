name: iGPSPORT to Intervals.icu Sync

on:
  schedule:
    # Runs every 5 minutes at minutes 2, 7, 12, 17, 22, 27, 32, 37, 42, 47, 52, 57
    - cron: '2-59/5 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
    inputs:
      sync_all:
        description: '과거 기록도 함께 업로드 (체크 해제 시: 앞으로의 신규 라이딩부터만 자동 동기화)'
        required: false
        type: boolean
        default: false
      sync_limit:
        description: '과거 기록 업로드 시 가져올 개수 (위 체크박스 선택 시에만 적용)'
        required: false
        type: string
        default: '20'

permissions:
  contents: write

concurrency:
  group: igpsport-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run iGPSPORT to Intervals & Strava Sync
        env:
          IGPSPORT_USER: ${{ secrets.IGPSPORT_USER }}
          IGPSPORT_PASS: ${{ secrets.IGPSPORT_PASS }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CLIENT_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
          SYNC_ALL: ${{ inputs.sync_all }}
          SYNC_LIMIT: ${{ inputs.sync_limit }}
        run: |
          python sync.py

      - name: Commit and push sync state
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add synced_rides.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update synced activities [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          else
            echo "No state changes to commit."
          fi
